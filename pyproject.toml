[project]
name = "argus"
version = "0.1.0"
description = "Windows PC 성능 이상 탐지 프로그램 — 평소와 다른 상태를 감지하고 원인 프로세스를 지목한다"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "yim2412" }]

# 각 Phase 착수 시 필요한 것을 추가한다.
#   Phase 1  : (없음 — psutil/pywin32/pynvml 이미 포함)
#   Phase 4-A: pyarrow, duckdb (웜 스토어)
#   Phase 5+ : scikit-learn, river
#   Phase 7  : torch, onnxruntime
#   Phase 10 : streamlit, plotly
dependencies = [
    "psutil>=6.0",
    "pywin32>=306",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "nvidia-ml-py>=12.560",
    # 웜 스토어. pyarrow 가 쓰기, duckdb 가 파티션 조회를 맡는다.
    "pyarrow>=17.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
argus = "argus.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.package-data]
argus = ["config/*.yaml", "storage/migrations/*.sql"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
]
