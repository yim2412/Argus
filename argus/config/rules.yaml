# Argus 기본 룰 — 패키지 동봉본. 이 파일을 직접 고치지 말 것.
# 사용자 룰은 %APPDATA%\Argus\rules.yaml 에 두면 이 파일을 대체한다.
#
# ---------------------------------------------------------------------------
# 왜 모든 룰이 상대 조건과 절대 조건을 **함께** 갖는가
#
# 상대값만 쓰면 조용한 PC 에서 오탐이 쏟아진다. 하루 종일 CPU 5% 인 사무용 PC 는
# 중앙값 5 / σ 0.5 라서 "평소 대비 5σ"가 겨우 7.5% 다. 8% 를 이상이라고 알리면
# 그건 오탐이다 — 사용자는 아무것도 느끼지 않는다.
#
# 절대값만 쓰면 하드웨어를 가정하게 된다. "디스크 응답 50ms 이상은 병목"은 HDD
# 사용자에게 평소이고, "CPU 85%"는 12코어 PC 에서 좀처럼 닿지 않는다.
#
# 그래서 둘 다 요구한다: **평소와 다르고(상대), 실제로 아플 만큼 높다(절대).**
# 절대 조건은 "이 정도면 사람이 느낀다"의 하한이지 탐지 임계값이 아니다.
# ---------------------------------------------------------------------------
#
# for      : 이만큼 지속되어야 발화. 순간 스파이크는 이상이 아니다.
# cooldown : 한 번 울리면 이만큼 조용히. 오탐 3번이면 사용자는 알림을 끈다.
# value    : 숫자 또는 식. 식에서 median / sigma / mad / baseline 을 쓸 수 있다.

version: 1

rules:
  - name: CPU 과부하
    when:
      all:
        - {metric: cpu_total, op: ">", value: "median + 5 * sigma"}
        - {metric: cpu_total, op: ">", value: 60}
    # 45초로 잡았더니 90초 램프 주입(임계 초과 42초)을 3초 차이로 놓쳤다.
    # 점진적 열화는 임계를 넘은 뒤 오래 머무르지 않고 계속 올라가는 중이라,
    # 지속 조건이 길면 "천천히 나빠지는 것"만 골라서 못 잡게 된다.
    for: 30s
    cooldown: 10m
    severity: warning
    explain: "CPU {cpu_total}% 로 45초 이상 지속 (평소 {cpu_total.median}%)"

  - name: 단일 코어 병목
    # 전체 CPU 는 여유로운데 코어 하나가 붙어 있는 상태. 게임·구형 프로그램에서
    # 체감 렉의 흔한 원인인데 전체 사용률만 보면 절대 안 보인다.
    when:
      all:
        - {metric: cpu_max_core, op: ">", value: 90}
        - {metric: cpu_total, op: "<", value: 50}
    for: 60s
    cooldown: 15m
    severity: info
    explain: "코어 하나가 {cpu_max_core}% 인데 전체는 {cpu_total}% — 단일 스레드 병목으로 보임"

  - name: 메모리 압박
    when:
      all:
        - {metric: mem_percent, op: ">", value: "median + 4 * sigma"}
        - {metric: mem_percent, op: ">", value: 80}
    for: 60s
    cooldown: 15m
    severity: warning
    explain: "메모리 {mem_percent}% 사용 (평소 {mem_percent.median}%), 여유 {mem_avail_mb}MB"

  - name: 메모리 이상 증가
    # "압박"과 다른 룰이다. 64GB PC 에서 메모리 누수가 18%p 를 먹어도 사용률은
    # 46% 라 압박 룰(80%)에 걸리지 않는다. 아직 아프지 않지만 **평소가 아니다** —
    # 누수는 아파지기 전에 잡아야 의미가 있다(Phase 7 의 주 타깃).
    #
    # 절대 조건을 사용률이 아니라 **평소 대비 증가폭(%p)** 으로 둔다. σ 만 쓰면
    # 메모리가 아주 평탄한 PC 에서 1%p 변동에도 울린다.
    when:
      all:
        - {metric: mem_percent, op: ">", value: "median + 5 * sigma"}
        - {metric: mem_percent, op: ">", value: "median + 5"}
    for: 90s
    cooldown: 20m
    severity: info
    explain: "메모리가 평소 {mem_percent.median}% 에서 {mem_percent}% 로 올라 지속 중"

  - name: 디스크 응답 저하
    # 사용률이 아니라 **응답시간**을 본다. 디스크가 바쁜 것은 문제가 아니고,
    # 요청이 밀려 오래 걸리는 것이 문제다. 증상 없는 원인은 알릴 가치가 없다.
    when:
      all:
        - {metric: disk_resp_ms, op: ">", value: "median + 6 * sigma"}
        # 병목 분류의 `bottleneck.disk_resp_floor_ms` 와 **같은 개념**이다. 여기가 3,
        # 저기가 5 여서 한 개념에 두 값이었다(2026-08-02 정리). 엄격한 쪽으로 맞춘다 —
        # 3ms 는 NVMe 에서 흔해 룰만 먼저 울리고 분류는 IO 라 하지 않는 일이 생긴다.
        - {metric: disk_resp_ms, op: ">", value: 5}
    for: 30s
    cooldown: 10m
    severity: warning
    explain: "디스크 응답 {disk_resp_ms}ms (평소 {disk_resp_ms.median}ms)"

  - name: 디스크 큐 적체
    # 큐 길이는 단위 자체가 하드웨어에 독립적이라 절대값이 의미를 갖는다.
    # 대부분의 PC 에서 이 값은 내내 0 이라 상대 통계가 서지 않는다(degenerate).
    when:
      all:
        - {metric: disk_queue, op: ">", value: 4}
    for: 30s
    cooldown: 10m
    severity: warning
    explain: "디스크 대기 요청 {disk_queue}개 — I/O 가 밀리고 있다"

  - name: 컨텍스트 스위치 급증
    # 경합 신호. 프로세스들이 서로를 밀어내며 실제 일을 못 하는 상태.
    when:
      all:
        - {metric: ctx_switches_ps, op: ">", value: "median + 8 * sigma"}
        # **코어 수에 비례한다(규칙 2).** 50000 은 12코어 기준으로 정한 값이라 4코어
        # PC 에서는 과하고, 정작 이 PC 에서는 **정상값 아래**였다 — 실측 중앙값 64,566
        # 으로 시간의 66.2% 가 이 문턱을 넘는다(2026-08-02). 상대 조건이 AND 로
        # 걸려 있어 발화까지 가진 않았지만, 하한으로서 아무 일도 하지 않고 있었다.
        - {metric: ctx_switches_ps, op: ">", value: "cores * 8000"}
    for: 60s
    cooldown: 20m
    severity: info
    explain: "컨텍스트 스위치 {ctx_switches_ps}/초 (평소 {ctx_switches_ps.median}/초)"

  # ---------------------------------------------------------------------------
  # GPU 발열은 **한 룰이 아니라 계단**이다.
  #
  # 하나로 두고 critical 을 물렸더니, 게임을 하는 동안 쿨다운(30분)마다 영구히
  # critical 이 나갔다. 실측 21시간에서 발화 6건 중 4건이 이 룰이었고 전부 critical
  # 이었다 — 오탐 3번이면 사용자가 알림을 끈다는 규칙에 정면으로 걸린다.
  #
  # 부하 시 스로틀링은 대부분의 GPU 에서 **정상 동작**이다(측정된 SW_THERMAL 2965
  # 샘플이 전부 부하 구간이었고, 유휴 시엔 한 번도 없었다). 알려야 하는 것은
  # "스로틀이 걸렸다"가 아니라 **얼마나 뜨겁고 얼마나 오래인가**다.
  #
  # 임계 온도를 절대값으로 두는 것은 하드웨어 가정이 아니다 — 실리콘 정션 온도의
  # 안전 한계는 벤더가 정하고 사용자 PC 마다 다르지 않다.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # **`GPU 열 스로틀링`(80도, info) 룰은 2026-08-02 에 없앴다.**
  #
  # 그 룰은 주석에 스스로 "부하 시 흔한 동작이다"라고 적어 두고 그것을 알리고 있었다.
  # 실측(5.9일): 이 PC 의 GPU 온도 중앙값이 83도이고 **시간의 52.6% 가 80도를 넘는다.**
  # 발화 55건 = 하루 9.3회. `rules` 신호 117건 중 GPU 룰이 75건(64%)이었다.
  #
  # 흔한 동작을 하루 9.3회 알리는 것은 정의상 오탐이다. 알림이 켜지는 순간(Phase 9)
  # 사용자는 그날로 알림을 끈다 — CLAUDE.md 가 "오탐 3번이면 제품은 죽는다"고 적은 경로다.
  # ---------------------------------------------------------------------------

  - name: GPU 고온 지속
    # 90도를 5분간. 여기부터는 부하가 아니라 냉각의 문제일 수 있다.
    #
    # **상대 조건을 AND 로 건다(2026-08-02).** 절대값만으로는 이 PC 에서 시간의 19.7% 가
    # 걸린다 — 90도가 이 GPU 의 정상 범위 안이기 때문이다. 부하 구간 실측에서 온도는
    # 6일 내내 **정확히 93.0도**였다(팬·클럭이 균형을 잡는 열 평형점).
    #
    # 상대 조건을 넣으면 그 평형점이 곧 "평소"가 되어 빠지고, 평소보다 뚜렷하게 뜨거운
    # 경우만 남는다(실측: 19.7% → 1.05%). 다른 룰과 같은 형태이기도 하다 — 디스크·
    # 컨텍스트 스위치는 처음부터 `median + k*sigma` 를 AND 로 걸고 있었다.
    #
    # ---------------------------------------------------------------------
    # **`median + 3 * sigma` 는 2026-08-12 에 `load_median + 5` 로 바꿨다.**
    #
    # 위 문단의 k=3 은 σ=4.2도를 근거로 골랐는데, 실측 σ 는 **8.9~11.9도**였다(유휴~부하
    # 가 한 창에 섞여 MAD 가 6~8도). 08-11 의 90도+ 317초 구간을 실제 엔진에 재생하니
    # 문턱이 102~120도로 계산됐고 **발화 0건**이었다 — 90도 초과 표본 1,102개 중 상대
    # 조건을 넘은 것이 14개뿐이었다. 룰은 08-03 이후 서 있는 척만 하고 있었다.
    #
    # **온도는 상한이 걸린 지표라 k 를 낮추는 것으로는 해결되지 않는다.** 스로틀링이
    # 온도를 열 평형점(이 PC 는 93도)에서 잡아 주므로, 그 평형점이 곧 median 이 되는
    # 순간 `median + k*sigma` 는 어떤 k 로도 도달 불가가 된다. k 를 아주 작게 잡으면
    # 절대 조건만 남는 08-02 이전 상태(시간의 19.7% 발화)로 되돌아간다.
    #
    # 그래서 **부하 구간만으로 세운 기준**(`load_median`)에 절대 여유 5도를 얹는다.
    # 이 PC: 부하 시 평소 93도 → 문턱 98도, 발화 0건 유지(냉각이 실제로 정상이다 —
    # 13일 실측에서 부하 시 온도 93.0도로 완전히 평평, 전력 +2.1%).
    # 평소 65도로 도는 PC: 문턱 70도 → 90도에서 정상 발화. 커버리지가 되살아난다.
    #
    # 부하의 정의(사용률 80%)는 `defaults.yaml` 의 `detection.load_gates` 에 있다.
    # ---------------------------------------------------------------------
    when:
      all:
        - {metric: gpu_temp_c, op: ">", value: "load_median + 5"}
        - {metric: gpu_temp_c, op: ">", value: 90}
        - {metric: gpu_throttle_reasons, op: "contains", value: "THERMAL"}
    for: 300s
    cooldown: 60m
    severity: warning
    explain: "GPU 가 {gpu_temp_c}도로 5분 이상 (평소 {gpu_temp_c.median}도) — 먼지·서멀·팬 커브를 확인할 만하다"

  - name: GPU 위험 온도
    when:
      all:
        - {metric: gpu_temp_c, op: ">", value: 95}
        - {metric: gpu_throttle_reasons, op: "contains", value: "THERMAL"}
    for: 60s
    cooldown: 60m
    severity: critical
    explain: "GPU {gpu_temp_c}도 — 하드웨어 보호 한계에 근접했다"

  - name: 스왑 사용
    # 스왑이 도는 순간 체감 속도가 무너진다. 평소 0 인 PC 가 많아 상대 조건을
    # 걸지 않는다(0 은 산포가 없어 상대 판정이 성립하지 않는다).
    #
    # **대신 RAM 에 비례시킨다(규칙 2).** 512MB 는 RAM 64GB 에서 0.8% 지만 4GB
    # 에서는 12.5% 다 — 같은 숫자가 기계마다 다른 뜻이 되고, 작은 PC 에서는 상시
    # 참이 된다. 5% 로 두면 4GB → 200MB, 64GB → 3.2GB 로 뜻이 같아진다.
    #
    # `mem_percent > 75` 를 AND 로 남기는 것이 요점이다. 스왑 사용량 자체는 압박의
    # 신호가 아니다(Windows 는 여유가 있어도 페이지파일을 쓴다 — PLAN §8 18번).
    # "메모리도 빠듯한데 스왑까지 돈다"가 되어야 진짜 압박이다.
    when:
      all:
        - {metric: swap_used_mb, op: ">", value: "ram_mb * 0.05"}
        - {metric: mem_percent, op: ">", value: 75}
    for: 120s
    cooldown: 30m
    severity: warning
    explain: "스왑 {swap_used_mb}MB 사용 중 (메모리 {mem_percent}%) — 디스크를 메모리처럼 쓰고 있다"
