# Argus 기본 설정 — 패키지 동봉본. 이 파일을 직접 고치지 말 것.
#
# 사용자 설정은 %APPDATA%\Argus\settings.yaml 이며, 첫 실행 시 이 파일의 사본이 생성된다.
# 적용 우선순위:  기본값(이 파일)  <  사용자 settings.yaml  <  환경변수(ARGUS_*)
#
# 환경변수 형식: ARGUS_<섹션>__<키>   예) ARGUS_BUDGET__CPU_PERCENT=1.0
#
# 규칙: 탐지 임계값을 코드에 박지 않는다. 튜닝은 코드 수정 없이 이 파일로만 되어야 한다.

general:
  log_level: INFO            # DEBUG / INFO / WARNING / ERROR
  console_log: true

storage:
  # 배치 쓰기 — 수집 스레드가 DB 를 기다리지 않게 모아서 넣는다.
  flush_interval_ms: 200
  flush_max_rows: 500
  # 큐가 가득 차면 오래된 것부터 버린다. 수집 경로는 절대 블로킹하지 않는다.
  queue_max_rows: 20000

budget:
  # Argus 자신의 리소스 상한. 모니터가 병목이 되는 순간 제품은 실패다.
  cpu_percent: 2.0
  rss_mb: 300
  check_interval_s: 5.0
  # 상한을 연속 몇 회 초과해야 스로틀을 올리는가 (순간 스파이크로 흔들리지 않게)
  breach_streak_to_throttle: 3
  # 연속 몇 회 여유로워야 스로틀을 내리는가. 올릴 때보다 크게 잡아 히스테리시스를 준다.
  calm_streak_to_relax: 12
  # 스로틀 단계별 수집 주기 배수 (1.0 = 정상)
  throttle_multipliers: [1.0, 2.0, 4.0, 10.0]

self_telemetry:
  enabled: true
  interval_s: 5.0

gap_monitor:
  # 절전 복귀·시각 변경 감지. 상주 프로그램은 PC 가 자는 것을 반드시 겪는다.
  enabled: true
  interval_s: 1.0
  # 예상 주기보다 이만큼 더 벌어지면 공백으로 본다. 너무 작으면 일시적 부하를
  # 절전으로 오인하고, 너무 크면 짧은 절전을 놓친다.
  threshold_s: 30.0

collector:
  # 1Hz 시스템 스냅샷 (CPU/메모리/디스크/네트워크)
  system_interval_s: 1.0
  # Windows 성능 카운터. 디스크 응답시간처럼 psutil 로 못 얻는 "증상" 지표를 담당한다.
  pdh_enabled: true
  # GPU. NVML 이 없으면 자동으로 꺼진다.
  gpu_enabled: true
  gpu_interval_s: 1.0

  process:
    enabled: true
    # 수집 주기. PDH "Process V2" 와일드카드 질의는 전체 프로세스를 한 번에 가져오므로
    # (약 11ms) 매 틱 전부를 수집해도 부담이 없다. 비싼 것은 수집이 아니라 저장이다.
    collect_interval_s: 1.0
    # 매 틱 저장할 활성 집합 크기 — CPU 상위 N + 메모리 상위 N + 포어그라운드
    top_cpu: 15
    top_memory: 10
    # 전체 프로세스를 저장하는 주기. 300개를 1초마다 넣으면 하루 2600만 행이 된다.
    full_store_interval_s: 30.0
    # PDH 를 쓸 수 없을 때(구형 Windows 등) psutil 로 내려가는데, 그쪽은 프로세스당
    # 개별 시스템 호출이라 300개 스캔에 1초 넘게 걸린다. 그래서 주기를 크게 잡는다.
    fallback_interval_s: 15.0

  network:
    enabled: true
    interval_s: 30.0
    # 연결 스냅샷은 개인정보가 짙다. 필요 없으면 여기서 끄면 된다.
    max_rows_per_snapshot: 500

retention:
  # 원본(초 단위) 보존 시간. 이후 단계에서 1분 집계로 다운샘플하면 더 줄일 수 있다.
  raw_hours: 24
  process_hours: 24
  network_hours: 72
  events_days: 30
  self_telemetry_days: 7
  # 정리 주기
  interval_s: 300.0

detection:
  # 탐지 엔진 설정. **임계값은 여기가 아니라 rules.yaml 에 있다.**
  enabled: true
  detector: rules
  # 저장된 관측을 따라 읽는 주기. 룰 지속 조건이 30초 이상이라 촘촘할 필요가 없다.
  interval_s: 10.0
  # "평소"를 계산할 창(초). 길수록 안정적이지만 최근 변화에 둔해진다.
  baseline_window_s: 1800.0
  min_samples: 60
  # 알림 발송은 Phase 9. 오탐률이 검증되기 전에 켜면 되돌릴 수 없다.
  notify: false

calibration:
  # 첫 실행 시 이 PC 의 기준선을 만든다. 하드웨어를 가정하지 않기 위해 필수.
  enabled: true
  # 디스크 벤치에 쓸 임시 파일 크기(MB). 캐시 폴더에 쓰고 즉시 지운다.
  disk_bench_mb: 16
  # 하드웨어 시그니처가 그대로면 재실행하지 않는다.
  reuse_days: 90
