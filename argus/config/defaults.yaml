# Argus 기본 설정 — 패키지 동봉본. 이 파일을 직접 고치지 말 것.
#
# 사용자 설정은 %APPDATA%\Argus\settings.yaml 이며, 첫 실행 시 이 파일의 사본이 생성된다.
# 적용 우선순위:  기본값(이 파일)  <  사용자 settings.yaml  <  환경변수(ARGUS_*)
#
# 환경변수 형식: ARGUS_<섹션>__<키>   예) ARGUS_BUDGET__CPU_PERCENT=1.0
#
# 규칙: 탐지 임계값을 코드에 박지 않는다. 튜닝은 코드 수정 없이 이 파일로만 되어야 한다.

general:
  log_level: INFO            # DEBUG / INFO / WARNING / ERROR
  console_log: true
  # 트레이 아이콘. 상주 프로그램인데 살아 있는지 보이지 않으면 사용자는 껐는지도 모른다.
  # **알림(풍선)도 이 아이콘을 통해 나가므로, 끄면 알림 경로가 함께 사라진다.**
  tray: true
  # 풍선 알림에 Windows 기본 알림음("띵동")을 낼 것인가. 기본은 무음이다 —
  # 상주 프로그램의 알림은 사용자가 부른 것이 아니라 끼어드는 것이라,
  # 소리까지 나면 오탐 한 번의 비용이 훨씬 커진다. 소리를 원하면 true.
  notify_sound: false

storage:
  # 배치 쓰기 — 수집 스레드가 DB 를 기다리지 않게 모아서 넣는다.
  flush_interval_ms: 200
  flush_max_rows: 500
  # 큐가 가득 차면 오래된 것부터 버린다. 수집 경로는 절대 블로킹하지 않는다.
  queue_max_rows: 20000

budget:
  # Argus 자신의 리소스 상한. 모니터가 병목이 되는 순간 제품은 실패다.
  cpu_percent: 2.0
  rss_mb: 300
  check_interval_s: 5.0
  # 상한을 연속 몇 회 초과해야 스로틀을 올리는가 (순간 스파이크로 흔들리지 않게)
  breach_streak_to_throttle: 3
  # 연속 몇 회 여유로워야 스로틀을 내리는가. 올릴 때보다 크게 잡아 히스테리시스를 준다.
  calm_streak_to_relax: 12
  # 스로틀 단계별 수집 주기 배수 (1.0 = 정상)
  throttle_multipliers: [1.0, 2.0, 4.0, 10.0]
  # 스로틀로 늘어난 대기를 얼마나 잘게 잘라 자는가. 이 간격마다 배수를 다시 보므로,
  # 스로틀이 풀린 뒤 최대 이만큼 늦게 정상 주기로 돌아온다.
  # 5.0 은 실측으로 정했다(2026-08-04): `Event.wait` 타임아웃 1회가 CPU 7.8us 라
  # 컴포넌트 10개 기준 하루 17만회를 깨워도 CPU 0.0016% — 예산 2% 의 1/1000 이다.
  # 깨어남 비용이 사실상 없으므로, 관측이 비는 시간을 줄이는 쪽으로 짧게 잡았다.
  wake_granularity_s: 5.0

self_telemetry:
  enabled: true
  interval_s: 5.0

gap_monitor:
  # 절전 복귀·시각 변경 감지. 상주 프로그램은 PC 가 자는 것을 반드시 겪는다.
  enabled: true
  interval_s: 1.0
  # 예상 주기보다 이만큼 더 벌어지면 공백으로 본다. 너무 작으면 일시적 부하를
  # 절전으로 오인하고, 너무 크면 짧은 절전을 놓친다.
  threshold_s: 30.0

collector:
  # 1Hz 시스템 스냅샷 (CPU/메모리/디스크/네트워크)
  system_interval_s: 1.0
  # Windows 성능 카운터. 디스크 응답시간처럼 psutil 로 못 얻는 "증상" 지표를 담당한다.
  pdh_enabled: true
  # GPU. NVML 이 없으면 자동으로 꺼진다.
  gpu_enabled: true
  gpu_interval_s: 1.0
  # 조회가 이만큼 연속 실패하면 NVML 을 다시 초기화한다. 드라이버 업데이트·GPU 리셋
  # 때 기존 핸들이 무효가 되는데, 재초기화가 없으면 재기동 전까지 GPU 가 통째로 빈다.
  # 한두 번의 실패는 정상이라 문턱을 둔다.
  gpu_recover_after_failures: 5
  # 재초기화가 실패했을 때 다음 시도까지의 간격(초). 드라이버가 아직 안 올라온 동안
  # 매 초 시도하면 실패 비용만 늘어난다.
  gpu_recover_backoff_s: 60.0

  process:
    enabled: true
    # 수집 주기. PDH "Process V2" 와일드카드 질의는 전체 프로세스를 한 번에 가져오므로
    # (약 11ms) 매 틱 전부를 수집해도 부담이 없다. 비싼 것은 수집이 아니라 저장이다.
    collect_interval_s: 1.0
    # 매 틱 저장할 활성 집합 크기 — CPU 상위 N + 메모리 상위 N + 포어그라운드
    top_cpu: 15
    top_memory: 10
    # **핸들 증가량 상위 N.** 이 축이 없으면 누수 탐지가 성립하지 않는다 — 핸들 누수
    # 프로세스는 CPU·메모리 상위에 못 들어 30초에 한 번만 저장되고, 첫 표본이 늦게 잡혀
    # procleak 의 배수가 문턱 밑으로 떨어진다(2026-07-30 실측: 주입 5건 중 3건 미탐).
    # 보유량이 아니라 증가량으로 고른다 — 상시 핸들이 많은 프로그램이 아니라 늘어나는
    # 프로그램이 누수다. 추가 조회 비용은 없다(스냅샷이 이미 전체를 담고 있다).
    top_handle_growth: 10
    # 전체 프로세스를 저장하는 주기. 300개를 1초마다 넣으면 하루 2600만 행이 된다.
    full_store_interval_s: 30.0
    # PDH 를 쓸 수 없을 때(구형 Windows 등) psutil 로 내려가는데, 그쪽은 프로세스당
    # 개별 시스템 호출이라 300개 스캔에 1초 넘게 걸린다. 그래서 주기를 크게 잡는다.
    fallback_interval_s: 15.0

  network:
    enabled: true
    interval_s: 30.0
    # 연결 스냅샷은 개인정보가 짙다. 필요 없으면 여기서 끄면 된다.
    max_rows_per_snapshot: 500

rollup:
  # 초 단위 원본을 1분으로 접는다. **이게 없으면 장기 데이터가 존재할 수 없다** —
  # 원본은 24시간 뒤 지워지는데 레짐·ML 단계는 며칠~2주치를 전제한다.
  enabled: true
  interval_s: 60.0
  # 진행 중인 분은 접지 않는다(반쪽이 된다). 배치 writer 여유까지 감안한 지연.
  lag_s: 90.0
  # 한 틱에 접을 버킷 상한. 오래 꺼져 있다 켜면 밀린 구간이 수천 분일 수 있다.
  max_buckets_per_run: 720
  # 프로세스 5분 롤업에서 버킷마다 남길 프로그램 수 (CPU 상위 N + 메모리 상위 N).
  # 상위 N 인 이유: 프로세스가 500개인 PC 에서도 하루 행 수에 상한이 있어야 한다.
  process_top_n: 40
  # 프로그램별 하루 사용시간. 하루 단위로 접히므로 자주 돌 이유가 없다.
  program_usage_interval_s: 3600.0
  # 한 번에 접을 날짜 수. 첫 실행은 `process_events` 가 남아 있는 만큼 밀려 있다.
  program_usage_days_per_run: 7
  # 일일 리포트도 하루 단위다. 같은 이유로 한 시간에 한 번.
  daily_report_interval_s: 3600.0
  daily_report_days_per_run: 7
  # 포어그라운드 표본 하나를 몇 초로 셀 것인가의 상한. 표본 간격을 그대로 더하면
  # **수집이 멈춰 있던 공백까지 사용시간이 된다**(실측: 상한 없이 361.6h, 실제 13.8h).
  # 값 자체는 결과를 거의 바꾸지 않는다 — 간격의 98.6% 가 정확히 1.0초라, 2초로 잡든
  # 30초로 잡든 합계가 13.8~14.0h 안에서만 움직였다(2026-08-13 측정).
  daily_report_gap_cap_s: 5.0
  # 원본이 그날 관측 시간의 몇 할을 덮어야 요약을 남길 것인가. **잘려나간 날을 영구
  # 저장하지 않기 위한 것이다** — daily_report 는 영구 보존인데 원본은 하루면 지워지므로,
  # 밀린 과거를 접으면 "그날 0.8시간 썼다"는 거짓이 굳고 나중에 고칠 수도 없다.
  # 실측에서 잘린 날 6.6~17.9% vs 온전한 날 79.5% 로 갈렸다(2026-08-13).
  daily_report_min_coverage: 0.5

warm:
  # 웜 스토어 — 끝난 날짜를 Parquet 일별 파티션으로 내보낸다.
  enabled: true
  interval_s: 3600.0
  # 오늘·어제는 건드리지 않는다. Parquet 은 append 가 안 되므로 한 번 쓰면 불변이어야 한다.
  export_after_days: 1
  compression: zstd
  purge_after_export: true

retention:
  # 원본(초 단위) 보존 시간. 1분 집계는 롤업이 따로 장기 보존한다.
  # **삭제는 롤업 워터마크를 넘지 못한다** — 접기 전에 지우면 영구 손실이다.
  raw_hours: 24
  process_hours: 24
  network_hours: 72
  events_days: 30
  self_telemetry_days: 7
  # 정리 주기
  interval_s: 300.0
  # 결함 주입 구간은 이 여유를 두고 지운다. 채점의 유일한 근거라 보존 기한만으로
  # 지우면 스코어보드가 조용히 비어 버린다.
  fault_guard_s: 900.0

  # **삭제를 나눈다 (2026-08-12).** `db._lock` 은 읽기·쓰기를 함께 덮는 전역 락이라
  # DELETE 하나가 끝날 때까지 수집 쓰기가 멈춘다. 한 번에 지우면 락 보유가 **밀린 양에
  # 비례**하는데, 평소는 몇 초치라 짧아도 PC 를 며칠 껐거나 롤업이 늦으면 수십만 행이
  # 한 트랜잭션에 들어간다.
  #
  # 실측 17일: 10초 넘는 쓰기 지연 17건 중 12건이 보존 정리·지문 갱신 근처였다(최대 109초).
  # 사본 벤치: `net_connections` 606,320행 한 번에 779ms → 2,000행씩 나누면 최악 113ms.
  # 전체로는 조금 더 걸리지만(1,240ms) 그건 수집을 멈추지 않는 시간이다.
  #
  # 0 으로 두면 나누지 않는다(옛 동작). 되돌리기가 한 줄이다.
  delete_chunk_rows: 2000
  delete_max_rows_per_tick: 200000

detection:
  # 탐지 엔진 설정. **임계값은 여기가 아니라 rules.yaml 에 있다.**
  enabled: true
  # 쉼표로 여러 개를 적으면 함께 돈다. 관측은 한 번만 읽어 공유하므로 탐지기를 늘려도
  # DB 읽기는 그대로다. rules 는 시스템 전역 메트릭을, procleak 은 프로세스별 지표를
  # 본다 — 서로 대체재가 아니라 보는 영역이 다르다. 핸들 누수는 전역 메트릭에 드러나지
  # 않아 rules 만으로는 F1 이 0.000 이었다.
  detector: rules,procleak
  # 저장된 관측을 따라 읽는 주기. 룰 지속 조건이 30초 이상이라 촘촘할 필요가 없다.
  interval_s: 10.0
  # "평소"를 계산할 창(초). 길수록 안정적이지만 최근 변화에 둔해진다.
  baseline_window_s: 1800.0
  min_samples: 60
  # 알림 발송. **2026-08-03 에 켰다.**
  #
  # 켜기 전 조건은 "오탐률이 검증됐는가"였고, 판정(`notified`)과 발송을 분리해 둔 덕에
  # 꺼진 상태로도 계속 측정됐다 — 20번 수정(GPU 룰 상대조건) 이후 **누적 약 8시간
  # (121분 게임 세션 포함) 알림 대상 0건**. 그전 6일은 하루 6.2건이었고 그중 최다가
  # GPU 고온 지속이었는데, 매일 93도로 게임하는 이 기계에서는 그게 "평소"였다.
  #
  # 오탐이 늘면 여기를 `false` 로 되돌린다. 되돌리기 비용이 한 줄이라는 것이 이 값을
  # 켤 수 있는 이유이기도 하다.
  notify: true

  # --- 프로그램 조건부 베이스라인 (Phase 4-B) ---
  #
  # "게임 중 CPU 60%"와 "브라우징 중 CPU 60%"는 다른 사건이다. 2026-08-04 실측에서
  # 포어그라운드 프로그램으로 나누면 리소스 변동계수가 **0.61 → 0.38** 로 줄었다 —
  # 같은 편차에 대해 z 가 약 1.6배가 된다는 뜻이다.
  #
  # 레짐을 리소스로 클러스터링해 나누는 방식(계획서 원안의 GMM+HMM)은 오히려 나빴다
  # (cv 0.43~0.49). 세 번의 측정과 기각 근거는 `docs/DONE.md` 에 있다.
  #
  # **기본은 꺼짐.** 켜면 안 잡히던 것이 잡히는 만큼 오탐도 는다. 리플레이
  # before/after 로 채택을 판정한 뒤에 켠다 — 오탐이 늘고 TP 가 그대로면 되돌린다.
  per_program: false
  # 프로그램별 창은 전역(1800초)보다 길어야 한다. 같은 프로그램을 계속 보고 있지
  # 않으므로 30분 창에는 표본이 몇 개 안 남는다.
  program_window_s: 3600.0
  # 표본 간 최소 간격. 프로그램 수만큼 메모리가 곱해지므로 솎아서 담는다 —
  # 중앙값·MAD 는 표본을 솎아도 거의 변하지 않으므로 여기서 줄이는 것이 싸다.
  program_min_interval_s: 5.0
  program_min_samples: 60
  # 동시에 들고 있을 프로그램 수 상한(LRU). 상한이 없으면 이름이 계속 바뀌는 환경에서
  # 메모리가 무한히 는다. 16개 × 6메트릭 기준 약 7MB.
  max_programs: 16

  # --- 부하 조건부 베이스라인 (2026-08-12) ---
  #
  # **온도는 상한이 걸린 지표다.** 스로틀링이 온도를 열 평형점에서 잡아 주므로, 유휴가
  # 섞인 창으로 `median + k*sigma` 를 만들면 문턱이 평형점보다 높아져 **어떤 k 로도
  # 도달할 수 없다.** 08-11 구간을 실제 엔진에 재생해 확인했다: 90도 초과 표본 1,102개
  # 중 상대 조건을 넘은 것 14개, 발화 0건, 엔진이 계산한 문턱 102~120도(MAD 6~8도).
  # `GPU 고온 지속` 룰은 08-03 이후 발화가 구조적으로 불가능한 상태였다.
  #
  # 부하 구간만으로 평소를 세우면 뜻이 돌아온다. 이 PC 는 부하 시 평소가 93도라 문턱
  # 98도(안 울림 — 13일 실측에서 온도가 정확히 93.0도로 평평했고 냉각은 정상이다),
  # 평소 65도로 도는 PC 는 문턱 70도라 90도에서 울린다. 하드웨어를 가정하지 않는다.
  #
  # 이 축을 **기본으로 켜는** 이유는 per_program 과 다르다. per_program 은 민감도를
  # 올리는 변경이라 채택 판정이 필요했지만, 이쪽은 발화 불가였던 룰을 발화 가능하게
  # 되돌리는 것이고 **이 기계에서의 발화 수는 0건 그대로**다(측정: 아래 룰 주석).
  load_gates:
    gpu_temp_c: {metric: gpu_util_percent, min: 80.0}
  # 부하 구간은 드물다 — 실측에서 이 PC 의 GPU 고부하는 하루 25~136분이었다.
  # 전역 창(1800초)으로는 표본이 서지 않는다.
  load_window_s: 21600.0
  load_min_interval_s: 5.0
  load_min_samples: 60

thermal_drift:
  # 냉각 열화 — "같은 부하에서 예전보다 뜨거운가".
  #
  # **절대 온도 문턱이 없다**(규칙 2). 노트북(평소 87도)이든 데스크탑(평소 70도)이든
  # 자기 과거와만 비교하므로 같은 값이 그대로 맞는다. 절대 온도는 사용자가 조치할 수
  # 없는 정보이기도 하다 — "GPU 93도"를 들으면 할 수 있는 일이 없지만, "같은 부하에서
  # 지난주보다 7도 높다"는 청소·서멀 재도포로 이어진다.
  enabled: true
  interval_s: 21600.0        # 6시간. 하루 단위 비교라 자주 볼 이유가 없다.
  # 부하를 맞춰 비교한다. 유휴를 섞으면 "요즘 게임을 많이 했다"가 "냉각이 나빠졌다"가 된다.
  min_gpu_util: 80.0
  min_busy_minutes: 20       # 하루에 이만큼 부하가 없던 날은 표본에서 뺀다
  recent_days: 3
  baseline_days: 14
  min_days: 7                # 이만큼 모이기 전에는 판정하지 않는다 (탐지 규칙 4)
  # 이만큼 오르면 알린다. 실측에서 이 PC 의 부하 시 온도는 6일간 변동이 0 이었다(93.0도).
  rise_c: 3.0

bottleneck:
  # 병목 분류("무엇에 막혔나")의 판정 문턱.
  #
  # **점수 가중치는 여기 없다.** 0.5·0.3·0.7 같은 값은 튜닝 값이 아니라 분류
  # 알고리즘의 구조라 코드에 남긴다. 노출하면 사용자가 병목 판정을 망가뜨릴 수 있고
  # 되돌릴 방법이 없다. 규칙 3 이 요구하는 것은 "임계값을 코드 수정 없이 튜닝"이다.
  z_high: 3.0
  # 디스크 응답의 체감 하한(ms). rules.yaml 의 디스크 룰이 같은 개념을 3 으로 써서
  # **한 개념에 두 값**이었다. 5.0 으로 통일했다 — 3ms 는 NVMe 에서 흔해 룰 쪽이 더
  # 자주 울렸고, 둘 중 엄격한 쪽을 남기는 것이 오탐을 줄인다.
  disk_resp_floor_ms: 5.0
  cpu_high_percent: 70.0
  cpu_elevated_percent: 40.0
  mem_high_percent: 85.0
  # 메모리가 '빠듯하다'고 볼 선. 스왑·상대 조건은 이 위에서만 근거가 된다 —
  # 스왑 단독으로는 근거가 못 된다(Windows 는 여유가 있어도 페이지파일을 쓴다).
  mem_tight_percent: 60.0
  disk_queue_high: 2.0
  disk_queue_alone: 4.0
  gpu_busy_percent: 90.0
  gpu_hot_c: 80.0
  cpu_perf_low_percent: 80.0
  # 경합은 "자원은 남는데 지연"이다. CPU 가 이 위면 경합이 아니라 CPU 병목이다.
  contention_cpu_ceiling_percent: 60.0
  # 방아쇠가 지목한 자원을 지표 근거가 뒤집으려면 이만큼 더 강해야 한다.
  override_ratio: 1.5
  override_margin: 0.3

incident:
  # 사건을 닫고 설명할 때의 문턱. 분류가 아니라 서술에 관한 값들이다.
  max_extend_before_s: 300.0
  max_extend_after_s: 600.0
  # 기여도가 이 아래인 후보에는 선행 시간을 붙이지 않는다 — 잡음이라 오해를 부른다.
  lead_min_share: 0.10
  # 이 안쪽 차이는 "거의 동시"로 쓴다. 샘플링 주기보다 촘촘하게 말하지 않는다.
  lead_resolution_s: 30.0
  # 저량 지표가 최고치의 이 비율 아래로 떨어지면 PID 재사용으로 보고 시계열을 끊는다.
  stock_drop_reset_ratio: 0.5

severity:
  # 등급을 가르는 문턱. **두 축이다** — 지금 겪는 손실과, 방치했을 때의 위험.
  # 지금까지 등급은 탐지기 종류에 붙어 있어(procleak 은 무조건 warning) 누수 규모나
  # 실제 성능 손실과 무관하게 결정됐다. 실사용 122건에서 역전이 실제로 나왔다.
  enabled: true

  # 위험 축 — 그 프로그램 자기 p99 대비 위치.
  # 실측(2026-08-03): medal(정상 동작) 0.12 · 주입 python(진짜 누수) 2.16.
  risk_warning_ratio: 1.0    # 평소 상한을 넘었다
  risk_critical_ratio: 2.0   # 평소 상한의 두 배
  risk_monotonic_floor: 0.95 # 이보다 등락하면 한 단계 내린다 (일하는 중에 가깝다)
  unknown_leak: warning      # 지문이 없는 프로세스. 지금까지의 고정값이 이것이었다.

  # 현재 손실 축 — 같은 부하에서 클럭이 얼마나 깎였나.
  impact_warning_loss: 0.10
  impact_critical_loss: 0.25

fingerprint:
  # 프로세스 지문 — "이 프로그램의 평소는 어디까지인가". process_leak 의 오탐을 줄인다.
  # 실측: medal(게임 녹화)이 핸들 383 → 1,395 로 늘어 발화했는데, medal 의 평소
  # handles_max p99 는 12,466 이었다. 자기 과거만 봐서는 이걸 가릴 수 없다.
  #
  # 억제는 한쪽으로만 작동한다 — 지문이 없으면(신규·희귀 프로세스) 아무것도 막지 않는다.
  enabled: true
  interval_s: 21600.0      # 6시간. 3일치 조건이라 자주 다시 만들 이유가 없다.
  min_days: 3              # 자격 있는 날이 이만큼 있어야 지문이 된다
  min_buckets: 100         # 3일에 걸쳐 보였어도 매번 5분씩이면 p99 를 세울 표본이 아니다
  # 이만큼 관측된 날만 하루로 센다 — 5분 켠 날이 하루로 세어지면 "3일"이 "3번 실행"이 된다.
  # 세는 단위는 *켜 둔 시간*이 아니라 활성 집합(상위 40)에 있던 시간이다. 6.0 은 그 오해에서
  # 나온 값이라 게임 클라이언트를 전부 잘랐다(지문 41% 탈락). 근거는 fingerprint.py 주석.
  min_day_hours: 1.0

process_leak:
  # 프로세스별 자원이 "줄지 않고 계속 자라는" 것을 잡는다. 시스템 전역 메트릭에는
  # 드러나지 않아 룰 엔진으로는 닿지 않는 영역이다 (핸들 누수가 대표적).
  enabled: true
  window_s: 900.0          # 추적 창
  min_duration_s: 300.0    # 이만큼 계속 자라야 발화. 켤 때의 급증은 누수가 아니다.
  min_samples: 20
  cooldown_s: 1800.0       # 누수는 고칠 때까지 계속된다 — 없으면 영원히 반복 알림
  # 동시 추적 상한. **프로세스 수가 아니라 트랙 수다(프로세스 × 지표).** 프로세스가
  # 200종인 PC 면 지표 2개로 400 을 채운다. 상한에 닿으면 가장 오래 갱신되지 않은
  # 트랙을 버리고 새 것을 받는다 — 새 프로세스를 거절하면 누수를 통째로 놓친다.
  max_tracked: 800
  drop_reset_ratio: 0.5    # 이 아래로 떨어지면 리셋 (PID 재사용·정상 해제)
  # 판정·정리 주기. 누수는 분 단위 현상이라 초당 판정할 이유가 없다. 판정 한 번이
  # 트랙 수백 개의 중앙값 계산이라, 매 틱 돌리면 관측자가 병목이 된다.
  eval_interval_s: 30.0

  handles:
    growth_ratio: 3.0      # 창 시작 대비 배수
    min_delta: 500.0       # 핸들 수는 하드웨어에 비례하지 않으므로 절대값이 맞다
    monotonic_ratio: 0.85  # "줄지 않은" 표본 비율. 등락하며 오르는 것은 일하는 중이다.

  rss_mb:
    growth_ratio: 3.0
    min_delta: 512.0
    monotonic_ratio: 0.9
    # RSS 는 RAM 에 비례한다. 512MB 는 4GB PC 에서 심각하고 64GB 에서는 탭 몇 개다.
    # 이 값을 주면 min_delta 대신 `RAM(MB) × 비율` 을 쓴다.
    min_delta_ram_ratio: 0.02

calibration:
  # 첫 실행 시 이 PC 의 기준선을 만든다. 하드웨어를 가정하지 않기 위해 필수.
  enabled: true
  # 디스크 벤치에 쓸 임시 파일 크기(MB). 캐시 폴더에 쓰고 즉시 지운다.
  disk_bench_mb: 16
  # 하드웨어 시그니처가 그대로면 재실행하지 않는다.
  reuse_days: 90

usage:
  # 사용시간 표에서 "내가 쓴 프로그램만"을 켰을 때 **추가로** 뺄 이름들.
  # 기본 필터는 포어그라운드 이력(창을 띄워 앞에 놓인 적이 있는가)인데, 그것만으로는
  # 개발·운영 도구가 남는다 — 창을 띄우기는 하지만 이것을 하려고 PC 를 켜지는 않는다.
  #
  # 사람마다 경계가 다르다. 개발자에게 터미널은 도구지 콘텐츠가 아니고, 누군가에게는
  # 그 반대다. 그래서 코드가 아니라 여기 둔다 — 지우면 다시 보인다.
  #
  # 이름은 정규화된 형태다: 확장자 없는 소문자(`chrome`, `league of legends`).
  exclude:
    - python
    - pythonw
    - py
    - claude
    - code
    - windowsterminal
    - wt
    - cmd
    - powershell
    - pwsh
    - conhost
    # Windows 셸이 앱을 감싸는 호스트. 앞에 놓이지만 사용자가 실행한 프로그램이
    # 아니다 — applicationframehost 는 UWP 앱의 창틀이고, 실측에서 155시간으로
    # 3위에 올라 있었다. explorer·taskmgr 은 뺀다: 그건 실제로 쓰는 프로그램이다.
    - applicationframehost
    - shellexperiencehost
    - startmenuexperiencehost
    - searchhost
    - textinputhost
    - pickerhost
    # 다른 앱이 띄우는 내장 브라우저. 이름만 보면 브라우저지만 사용자가 실행한 것이
    # 아니다 — 호스트는 시작 메뉴 검색·Game Bar 위젯 같은 것들이고, 그 호스트는
    # 이미 위에서 뺀다. 2026-08-12 실측에서 SearchHost 몫으로만 6개 371MB 였다.
    - msedgewebview2
    - openwith
    - easeofaccessdialog
    - credentialuibroker
    - werfault
    - dwm
    # Argus 자신. 관측자가 관측 대상 목록에 오르면 안 된다.
    - argus
    - argus-ui

  # 하루를 가르는 시간대. [시작시, 끝시) 로 로컬 시각을 나눈다.
  #
  # **경계는 사실이 아니라 습관이다.** 누군가의 "새벽"은 다른 사람의 근무 시간이라
  # 코드에 박을 값이 아니다. 24시간을 다 덮지 않아도 되고(안 덮은 시간은 어느 칸에도
  # 들어가지 않는다) 이름도 자유롭게 바꿔 쓰면 된다.
  slots:
    새벽: [0, 6]
    오전: [6, 12]
    오후: [12, 18]
    저녁: [18, 24]

  # 일일 리포트가 "무엇을 하며 보냈나"를 묶는 단위. 이름 -> 카테고리.
  #
  # **위 `exclude` 와 별개 목록이다.** 사용시간 표는 python·windowsterminal 을
  # 빼지만(도구지 콘텐츠가 아니다) 생산성 리포트에서 "개발"은 오히려 핵심 지표다.
  # 하나로 합치면 둘 중 하나가 반드시 틀린다.
  #
  # **이 목록은 개발 PC 의 것이라 배포 기본값의 근거가 아니다.** 남의 PC 에는 없는
  # 이름이고, 있어도 다르게 분류될 수 있다(누군가에게 chrome 은 브라우징이 아니라
  # 업무다). 없는 이름은 "기타"로 가며, 분류가 비어도 총 시간·Top 5·시간대는
  # 그대로 나온다. 카테고리 이름 자체도 자유롭게 바꿔 쓰면 된다.
  categories:
    게임:
      - league of legends
      - leagueclientux
      - tslgame
      - overwatch
      - rainbowsix
      - rainbowsix_be
      - fczf
      - fm
      - civilizationvi_dx12
      - mahjong-jp
      - steam
      - steamwebhelper
      - upc
      - belaunchernew
    개발:
      - python
      - pythonw
      - claude
      - code
      - windowsterminal
      - wt
    브라우징:
      - chrome
      - msedge
      - whale
      - firefox
    소통:
      - discord
      - kakaotalk
    미디어:
      - medal
      - streamdeck
      - nliveconnector
      - potplayermini64
      - vlc
