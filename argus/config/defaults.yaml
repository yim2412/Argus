# Argus 기본 설정 — 패키지 동봉본. 이 파일을 직접 고치지 말 것.
#
# 사용자 설정은 %APPDATA%\Argus\settings.yaml 이며, 첫 실행 시 이 파일의 사본이 생성된다.
# 적용 우선순위:  기본값(이 파일)  <  사용자 settings.yaml  <  환경변수(ARGUS_*)
#
# 환경변수 형식: ARGUS_<섹션>__<키>   예) ARGUS_BUDGET__CPU_PERCENT=1.0
#
# 규칙: 탐지 임계값을 코드에 박지 않는다. 튜닝은 코드 수정 없이 이 파일로만 되어야 한다.

general:
  log_level: INFO            # DEBUG / INFO / WARNING / ERROR
  console_log: true

storage:
  # 배치 쓰기 — 수집 스레드가 DB 를 기다리지 않게 모아서 넣는다.
  flush_interval_ms: 200
  flush_max_rows: 500
  # 큐가 가득 차면 오래된 것부터 버린다. 수집 경로는 절대 블로킹하지 않는다.
  queue_max_rows: 20000

budget:
  # Argus 자신의 리소스 상한. 모니터가 병목이 되는 순간 제품은 실패다.
  cpu_percent: 2.0
  rss_mb: 300
  check_interval_s: 5.0
  # 상한을 연속 몇 회 초과해야 스로틀을 올리는가 (순간 스파이크로 흔들리지 않게)
  breach_streak_to_throttle: 3
  # 연속 몇 회 여유로워야 스로틀을 내리는가. 올릴 때보다 크게 잡아 히스테리시스를 준다.
  calm_streak_to_relax: 12
  # 스로틀 단계별 수집 주기 배수 (1.0 = 정상)
  throttle_multipliers: [1.0, 2.0, 4.0, 10.0]

self_telemetry:
  enabled: true
  interval_s: 5.0

gap_monitor:
  # 절전 복귀·시각 변경 감지. 상주 프로그램은 PC 가 자는 것을 반드시 겪는다.
  enabled: true
  interval_s: 1.0
  # 예상 주기보다 이만큼 더 벌어지면 공백으로 본다. 너무 작으면 일시적 부하를
  # 절전으로 오인하고, 너무 크면 짧은 절전을 놓친다.
  threshold_s: 30.0

collector:
  # 1Hz 시스템 스냅샷 (CPU/메모리/디스크/네트워크)
  system_interval_s: 1.0
  # Windows 성능 카운터. 디스크 응답시간처럼 psutil 로 못 얻는 "증상" 지표를 담당한다.
  pdh_enabled: true
  # GPU. NVML 이 없으면 자동으로 꺼진다.
  gpu_enabled: true
  gpu_interval_s: 1.0

  process:
    enabled: true
    # 수집 주기. PDH "Process V2" 와일드카드 질의는 전체 프로세스를 한 번에 가져오므로
    # (약 11ms) 매 틱 전부를 수집해도 부담이 없다. 비싼 것은 수집이 아니라 저장이다.
    collect_interval_s: 1.0
    # 매 틱 저장할 활성 집합 크기 — CPU 상위 N + 메모리 상위 N + 포어그라운드
    top_cpu: 15
    top_memory: 10
    # 전체 프로세스를 저장하는 주기. 300개를 1초마다 넣으면 하루 2600만 행이 된다.
    full_store_interval_s: 30.0
    # PDH 를 쓸 수 없을 때(구형 Windows 등) psutil 로 내려가는데, 그쪽은 프로세스당
    # 개별 시스템 호출이라 300개 스캔에 1초 넘게 걸린다. 그래서 주기를 크게 잡는다.
    fallback_interval_s: 15.0

  network:
    enabled: true
    interval_s: 30.0
    # 연결 스냅샷은 개인정보가 짙다. 필요 없으면 여기서 끄면 된다.
    max_rows_per_snapshot: 500

rollup:
  # 초 단위 원본을 1분으로 접는다. **이게 없으면 장기 데이터가 존재할 수 없다** —
  # 원본은 24시간 뒤 지워지는데 레짐·ML 단계는 며칠~2주치를 전제한다.
  enabled: true
  interval_s: 60.0
  # 진행 중인 분은 접지 않는다(반쪽이 된다). 배치 writer 여유까지 감안한 지연.
  lag_s: 90.0
  # 한 틱에 접을 버킷 상한. 오래 꺼져 있다 켜면 밀린 구간이 수천 분일 수 있다.
  max_buckets_per_run: 720
  # 프로세스 5분 롤업에서 버킷마다 남길 프로그램 수 (CPU 상위 N + 메모리 상위 N).
  # 상위 N 인 이유: 프로세스가 500개인 PC 에서도 하루 행 수에 상한이 있어야 한다.
  process_top_n: 40

warm:
  # 웜 스토어 — 끝난 날짜를 Parquet 일별 파티션으로 내보낸다.
  enabled: true
  interval_s: 3600.0
  # 오늘·어제는 건드리지 않는다. Parquet 은 append 가 안 되므로 한 번 쓰면 불변이어야 한다.
  export_after_days: 1
  compression: zstd
  purge_after_export: true

retention:
  # 원본(초 단위) 보존 시간. 1분 집계는 롤업이 따로 장기 보존한다.
  # **삭제는 롤업 워터마크를 넘지 못한다** — 접기 전에 지우면 영구 손실이다.
  raw_hours: 24
  process_hours: 24
  network_hours: 72
  events_days: 30
  self_telemetry_days: 7
  # 정리 주기
  interval_s: 300.0

detection:
  # 탐지 엔진 설정. **임계값은 여기가 아니라 rules.yaml 에 있다.**
  enabled: true
  # 쉼표로 여러 개를 적으면 함께 돈다. 관측은 한 번만 읽어 공유하므로 탐지기를 늘려도
  # DB 읽기는 그대로다. rules 는 시스템 전역 메트릭을, procleak 은 프로세스별 지표를
  # 본다 — 서로 대체재가 아니라 보는 영역이 다르다. 핸들 누수는 전역 메트릭에 드러나지
  # 않아 rules 만으로는 F1 이 0.000 이었다.
  detector: rules,procleak
  # 저장된 관측을 따라 읽는 주기. 룰 지속 조건이 30초 이상이라 촘촘할 필요가 없다.
  interval_s: 10.0
  # "평소"를 계산할 창(초). 길수록 안정적이지만 최근 변화에 둔해진다.
  baseline_window_s: 1800.0
  min_samples: 60
  # 알림 발송은 Phase 9. 오탐률이 검증되기 전에 켜면 되돌릴 수 없다.
  notify: false

process_leak:
  # 프로세스별 자원이 "줄지 않고 계속 자라는" 것을 잡는다. 시스템 전역 메트릭에는
  # 드러나지 않아 룰 엔진으로는 닿지 않는 영역이다 (핸들 누수가 대표적).
  enabled: true
  window_s: 900.0          # 추적 창
  min_duration_s: 300.0    # 이만큼 계속 자라야 발화. 켤 때의 급증은 누수가 아니다.
  min_samples: 20
  cooldown_s: 1800.0       # 누수는 고칠 때까지 계속된다 — 없으면 영원히 반복 알림
  # 동시 추적 상한. **프로세스 수가 아니라 트랙 수다(프로세스 × 지표).** 프로세스가
  # 200종인 PC 면 지표 2개로 400 을 채운다. 상한에 닿으면 가장 오래 갱신되지 않은
  # 트랙을 버리고 새 것을 받는다 — 새 프로세스를 거절하면 누수를 통째로 놓친다.
  max_tracked: 800
  drop_reset_ratio: 0.5    # 이 아래로 떨어지면 리셋 (PID 재사용·정상 해제)
  # 판정·정리 주기. 누수는 분 단위 현상이라 초당 판정할 이유가 없다. 판정 한 번이
  # 트랙 수백 개의 중앙값 계산이라, 매 틱 돌리면 관측자가 병목이 된다.
  eval_interval_s: 30.0

  handles:
    growth_ratio: 3.0      # 창 시작 대비 배수
    min_delta: 500.0       # 핸들 수는 하드웨어에 비례하지 않으므로 절대값이 맞다
    monotonic_ratio: 0.85  # "줄지 않은" 표본 비율. 등락하며 오르는 것은 일하는 중이다.

  rss_mb:
    growth_ratio: 3.0
    min_delta: 512.0
    monotonic_ratio: 0.9
    # RSS 는 RAM 에 비례한다. 512MB 는 4GB PC 에서 심각하고 64GB 에서는 탭 몇 개다.
    # 이 값을 주면 min_delta 대신 `RAM(MB) × 비율` 을 쓴다.
    min_delta_ram_ratio: 0.02

calibration:
  # 첫 실행 시 이 PC 의 기준선을 만든다. 하드웨어를 가정하지 않기 위해 필수.
  enabled: true
  # 디스크 벤치에 쓸 임시 파일 크기(MB). 캐시 폴더에 쓰고 즉시 지운다.
  disk_bench_mb: 16
  # 하드웨어 시그니처가 그대로면 재실행하지 않는다.
  reuse_days: 90
