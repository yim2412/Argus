# 조용한 관측 기계용 설정 (2026-08-17)
#
# 이 파일을 `%APPDATA%\Argus\settings.yaml` 로 복사하면 그 기계는 **수집·탐지는
# 그대로 하되 화면에 아무것도 띄우지 않는다.**
#
# 첫 대상은 창모드 게임 + 마우스 매크로를 24시간 돌리는 노트북이다. 그 환경에서
# 풍선 알림은 화면 우하단에 떠서 매크로의 클릭 좌표를 가린다 — 기능이 아니라
# 방해다.
#
# ────────────────────────────────────────────────────────────────────────────
# **일부러 이 한 줄만 바꾼다.**
#
# 이 기계를 붙이는 목적이 "배포 기본값이 두 번째 하드웨어에서 어떻게 도는가"를
# 재는 것이라, 다른 값을 여기서 손대면 재려던 것을 못 재게 된다. 특히:
#
#   - `detection.per_program` 은 **기본값(false) 그대로 둔다.** 이 PC 에서는
#     켜져 있지만, 켤지 말지를 판정하려고 두 번째 기계를 붙이는 것이다.
#   - `budget.cpu_percent` 도 손대지 않는다. 4코어 기계에서 2% 예산이 넘치는지,
#     넘칠 때 자동 스로틀이 실제로 도는지가 이 기계에서 처음 관측된다.
#   - 임계값은 애초에 손댈 것이 없다 — `machine_profile` 캘리브레이션이 그 기계
#     기준으로 상대화한다(설계 규칙 2).
#
# 알림을 나중에 켜고 싶으면 **파일을 고칠 필요가 없다.** `detection.notify` 는
# 실행 중에 바꿀 수 있는 값이라(`runtime/livecfg.py` 의 LIVE_KEYS) 트레이 메뉴에서
# 바로 켜진다. 재시작도 필요 없다.
# ────────────────────────────────────────────────────────────────────────────

detection:
  # 사건은 그대로 기록하고 발송만 하지 않는다.
  #
  # **판정 재료는 하나도 잃지 않는다.** 오탐률은 풍선을 세는 것이 아니라
  # `incidents` 테이블을 세어서 낸다 — 개발 PC 에서도 그렇게 하고 있다.
  # `notified` 컬럼에 0 이 남으므로 "알림이 나갔을 상황"도 사후에 셀 수 있다.
  notify: false
